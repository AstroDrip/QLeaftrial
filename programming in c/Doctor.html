<!DOCTYPE html>
<html>
<head>
    <title>Doctor Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="css/bootstrap.css">
    <style>
        body {
            margin: 30px;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .form-control {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .form-control:focus {
            border-color: #aaa;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .btn {
            margin-bottom: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: #fff;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #3e8e41;
        }

        .btn:active {
            background-color: #3e8e41;
            transform: translateY(2px);
        }

        .table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f0f0f0;
        }

        .deleteDoctor, .updateDoctor {
            margin-left: 10px;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            background-color: #e74c3c;
            color: #fff;
            cursor: pointer;
        }

        .deleteDoctor:hover, .updateDoctor:hover {
            background-color: #c0392b;
        }

        .deleteDoctor:active, .updateDoctor:active {
            background-color: #c0392b;
            transform: translateY(2px);
        }

        /* Hover effects for table rows */
        .table tr:hover {
            background-color: #f9f9f9;
        }

        /* Add some padding to the table cells */
        .table td, .table th {
            padding: 15px;
        }

        /* Make the table headers sticky */
        .table thead th {
            position: sticky;
            top: 0;
            background-color: #fff;
        }
    </style>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Doctor Management System</h2>
        <form>
            <fieldset>
                <legend>Add Doctor</legend>
                <input type="number" class="form-control" id="doctor_id" placeholder="Enter Doctor ID">
                <input type="text" class="form-control" id="doctor_name" placeholder="Enter Doctor Name">
                <input type="text" class="form-control" id="department" placeholder="Enter Department">
                <input type="text" class="form-control" id="phone_no" placeholder="Enter Phone No.">
                <br>
                <button type="button" id="addDoctor" class="btn btn-success">Add Doctor</button>
                <button type="button" id="fetchDoctors" class="btn btn-primary">Fetch Doctors</button>
            </fieldset>
        </form>

        <h4>Doctor Records</h4>
        <table class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th>Doctor ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Phone No.</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="doctorList"></tbody>
        </table>
    </div>

    <script type="text/javascript">
        let db;
        const request = indexedDB.open("HospitalDBD", 1);

        request.onupgradeneeded = function(event) {
            db = event.target.result;
            let objectStore = db.createObjectStore("doctors", { keyPath: "doctor_id" });
            objectStore.createIndex("doctor_name", "doctor_name", { unique: false });
            objectStore.createIndex("department", "department", { unique: false });
            objectStore.createIndex("phone_no", "phone_no", { unique: false });
        };

        request.onsuccess = function(event) {
            db = event.target.result;
        };

        request.onerror = function(event) {
            console.log("Error opening database", event.target.errorCode);
        };

        $("#addDoctor").click(function() {
            let doctor_id = Number($("#doctor_id").val());
            let doctor_name = $("#doctor_name").val();
            let department = $("#department").val();
            let phone_no = $("#phone_no").val();

            if (!doctor_id || !doctor_name || !department || !phone_no) {
                alert("Please fill all fields.");
                return;
            }

            let transaction = db.transaction(["doctors"], "readwrite");
            let objectStore = transaction.objectStore("doctors");

            let getRequest = objectStore.get(doctor_id);
            getRequest.onsuccess = function() {
                if (getRequest.result) {
                    alert("Doctor ID already exists! Please use a unique ID.");
                } else {
                    let addRequest = objectStore.add({ doctor_id, doctor_name, department, phone_no });

                    addRequest.onsuccess = function() {
                        alert("Doctor added successfully.");
                        clearFields();
                    };

                    addRequest.onerror = function() {
                        alert("Error adding doctor.");
                    };
                }
            };
        });

        $("#fetchDoctors").click(function() {
            $("#doctorList").empty();
            let transaction = db.transaction(["doctors"], "readonly");
            let objectStore = transaction.objectStore("doctors");
            let request = objectStore.openCursor();

            request.onsuccess = function(event) {
                let cursor = event.target.result;
                if (cursor) {
                    $("#doctorList").append(
                        `<tr id="row${cursor.value.doctor_id}">
                            <td>${cursor.value.doctor_id}</td>
                            <td id="name${cursor.value.doctor_id}">${cursor.value.doctor_name}</td>
                            <td id="department${cursor.value.doctor_id}">${cursor.value.department}</td>
                            <td id="phone_no${cursor.value.doctor_id}">${cursor.value.phone_no}</td>
                            <td>
                                <button class="btn btn-danger deleteDoctor" data-id="${cursor.value.doctor_id}">Delete</button>
                                <button class="btn btn-primary updateDoctor" data-id="${cursor.value.doctor_id}">Modify</button>
                            </td>
                        </tr>`
                    );
                    cursor.continue();
                } else {
                    if (!$("#doctorList").children().length) {
                        $("#doctorList").append("<tr><td colspan='5' align='center'>No Doctors Found</td></tr>");
                    }
                }
            };
        });

        $(document).on("click", ".deleteDoctor", function() {
            let id = Number($(this).data("id"));
            let transaction = db.transaction(["doctors"], "readwrite");
            let objectStore = transaction.objectStore("doctors");
            let request = objectStore.delete(id);

            request.onsuccess = function() {
                $("#row" + id).fadeOut();
                alert("Doctor deleted successfully.");
            };
        });

        $(document).on("click", ".updateDoctor", function() {
            let id = Number($(this).data("id"));

            let transaction = db.transaction(["doctors"], "readwrite");
            let objectStore = transaction.objectStore("doctors");
            let request = objectStore.get(id);

            request.onsuccess = function(event) {
                let data = event.target.result;
                if (!data) {
                    alert("Doctor not found.");
                    return;
                }

                let newName = prompt("Enter new Doctor Name:", data.doctor_name) || data.doctor_name;
                let newDepartment = prompt("Enter new Department:", data.department) || data.department;
                let newPhoneNo = prompt("Enter new Phone No.:", data.phone_no) || data.phone_no;

                data.doctor_name = newName;
                data.department = newDepartment;
                data.phone_no = newPhoneNo;

                let updateRequest = objectStore.put(data);

                updateRequest.onsuccess = function() {
                    $("#name" + id).text(newName);
                    $("#department" + id).text(newDepartment);
                    $("#phone_no" + id).text(newPhoneNo);

                    alert("Doctor record updated successfully.");
                };

                updateRequest.onerror = function() {
                    alert("Error updating doctor record.");
                };
            };
        });

        function clearFields() {
            $("#doctor_id").val("");
            $("#doctor_name").val("");
            $("#department").val("");
            $("#phone_no").val("");
        }
    </script>
</body>
</html>
