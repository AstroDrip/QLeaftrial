<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .tab-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .tab-container button {
            background: #1e1e1e;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
            margin: 5px;
        }
        .tab-container button:hover {
            background: #333;
        }
        .hidden {
            display: none;
        }
        .table-container {
            width: 100%;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e1e1e;
        }
        th, td {
            padding: 10px;
            border: 1px solid #333;
            text-align: left;
        }
        th {
            background: #333;
        }
        .search-box {
            margin-bottom: 15px;
        }
        .search-box input {
            width: 100%;
            padding: 8px;
            border: none;
            background: #1e1e1e;
            color: white;
        }
        .smooth-transition {
            transition: all 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hospital Management System</h2>
        <div class="tab-container">
            <button onclick="showTab('patients')">Patients</button>
            <button onclick="showTab('doctors')">Doctors</button>
            <button onclick="showTab('appointments')">Appointments</button>
            <button onclick="showTab('billing')">Billing</button>
        </div>
        
        <div id="patients" class="tab-content hidden smooth-transition">
            <h2>Patient Records</h2>
            <div class="search-box">
                <input type="text" id="searchPatient" placeholder="Search Patients...">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="patientList"></tbody>
            </table>
        </div>
        
        <div id="doctors" class="tab-content hidden smooth-transition">
            <h2>Doctor Records</h2>
            <div class="search-box">
                <input type="text" id="searchDoctor" placeholder="Search Doctors...">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Name</th><th>Department</th><th>Phone</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="doctorList"></tbody>
            </table>
        </div>
        
        <div id="appointments" class="tab-content hidden smooth-transition">
            <h2>Appointments</h2>
            <div class="search-box">
                <input type="text" id="searchAppointment" placeholder="Search Appointments...">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Appointment No.</th><th>Patient ID</th><th>Doctor ID</th><th>Date</th><th>Time</th><th>Diagnosis</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="appointmentList"></tbody>
            </table>
        </div>
        
        <div id="billing" class="tab-content hidden smooth-transition">
            <h2>Billing</h2>
            <div class="search-box">
                <input type="text" id="searchBill" placeholder="Search Bills...">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Bill No.</th><th>Appointment No.</th><th>Amount</th><th>Payment Method</th><th>Payment Status</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="billList"></tbody>
            </table>
        </div>
    </div>
    
    <script>
        function showTab(tabName) {
            $(".tab-content").addClass("hidden");
            $("#" + tabName).removeClass("hidden");
        }
        
        $("#searchPatient").on("keyup", function() {
            let value = $(this).val().toLowerCase();
            $("#patientList tr").filter(function() {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
            });
        });

        $("#searchDoctor").on("keyup", function() {
            let value = $(this).val().toLowerCase();
            $("#doctorList tr").filter(function() {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
            });
        });

        $("#searchAppointment").on("keyup", function() {
            let value = $(this).val().toLowerCase();
            $("#appointmentList tr").filter(function() {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
            });
        });

        $("#searchBill").on("keyup", function() {
            let value = $(this).val().toLowerCase();
            $("#billList tr").filter(function() {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
            });
        });
    </script>
</body>
</html>
