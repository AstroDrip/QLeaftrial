<!DOCTYPE html>
<html>
<head>
    <title>Patient Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="css/bootstrap.css">
    <style>
        body {
            margin: 30px;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .form-control {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .form-control:focus {
            border-color: #aaa;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .btn {
            margin-bottom: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: #fff;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #3e8e41;
        }

        .btn:active {
            background-color: #3e8e41;
            transform: translateY(2px);
        }

        .table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f0f0f0;
        }

        .deletePatient, .updatePatient {
            margin-left: 10px;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            background-color: #e74c3c;
            color: #fff;
            cursor: pointer;
        }

        .deletePatient:hover, .updatePatient:hover {
            background-color: #c0392b;
        }

        .deletePatient:active, .updatePatient:active {
            background-color: #c0392b;
            transform: translateY(2px);
        }

        /* Hover effects for table rows */
        .table tr:hover {
            background-color: #f9f9f9;
        }

        /* Add some padding to the table cells */
        .table td, .table th {
            padding: 15px;
        }

        /* Make the table headers sticky */
        .table thead th {
            position: sticky;
            top: 0;
            background-color: #fff;
        }
    </style>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Patient Management System</h2>
        <form>
            <fieldset>
                <legend>Add Patient</legend>
                <input type="number" class="form-control" id="patient_id" placeholder="Enter Patient ID">
                <input type="text" class="form-control" id="patient_name" placeholder="Enter Patient Name">
                <input type="number" class="form-control" id="age" placeholder="Enter Age">
                <select class="form-control" id="gender">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                <input type="text" class="form-control" id="phone" placeholder="Enter Phone No.">
                <br>
                <button type="button" id="addPatient" class="btn btn-success">Add Patient</button>
                <button type="button" id="fetchPatients" class="btn btn-primary">Fetch Patients</button>
            </fieldset>
        </form>

        <h4>Patient Records</h4>
        <table class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th>Patient ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Phone No.</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="patientList"></tbody>
        </table>
    </div>

    <script type="text/javascript">
        let db;
        const request = indexedDB.open("HospitalDB", 1);

        request.onupgradeneeded = function(event) {
            db = event.target.result;
            let objectStore = db.createObjectStore("patients", { keyPath: "patient_id" });
            objectStore.createIndex("patient_name", "patient_name", { unique: false });
            objectStore.createIndex("age", "age", { unique: false });
            objectStore.createIndex("gender", "gender", { unique: false });
            objectStore.createIndex("phone", "phone", { unique: false });
        };

        request.onsuccess = function(event) {
            db = event.target.result;
        };

        request.onerror = function(event) {
            console.log("Error opening database", event.target.errorCode);
        };

        $("#addPatient").click(function() {
            let patient_id = Number($("#patient_id").val());
            let patient_name = $("#patient_name").val();
            let age = Number($("#age").val());
            let gender = $("#gender").val();
            let phone = $("#phone").val();

            if (!patient_id || !patient_name || !age || !gender || !phone) {
                alert("Please fill all fields.");
                return;
            }

            let transaction = db.transaction(["patients"], "readwrite");
            let objectStore = transaction.objectStore("patients");

            let getRequest = objectStore.get(patient_id);
            getRequest.onsuccess = function() {
                if (getRequest.result) {
                    alert("Patient ID already exists! Please use a unique ID.");
                } else {
                    let addRequest = objectStore.add({ patient_id, patient_name, age, gender, phone });

                    addRequest.onsuccess = function() {
                        alert("Patient added successfully.");
                        clearFields();
                    };

                    addRequest.onerror = function() {
                        alert("Error adding patient.");
                    };
                }
            };
        });

        $("#fetchPatients").click(function() {
            $("#patientList").empty();
            let transaction = db.transaction(["patients"], "readonly");
            let objectStore = transaction.objectStore("patients");
            let request = objectStore.openCursor();

            request.onsuccess = function(event) {
                let cursor = event.target.result;
                if (cursor) {
                    $("#patientList").append(
                        `<tr id="row${cursor.value.patient_id}">
                            <td>${cursor.value.patient_id}</td>
                            <td id="name${cursor.value.patient_id}">${cursor.value.patient_name}</td>
                            <td id="age${cursor.value.patient_id}">${cursor.value.age}</td>
                            <td id="gender${cursor.value.patient_id}">${cursor.value.gender}</td>
                            <td id="phone${cursor.value.patient_id}">${cursor.value.phone}</td>
                            <td>
                                <button class="btn btn-danger deletePatient" data-id="${cursor.value.patient_id}">Delete</button>
                                <button class="btn btn-primary updatePatient" data-id="${cursor.value.patient_id}">Modify</button>
                            </td>
                        </tr>`
                    );
                    cursor.continue();
                } else {
                    if (!$("#patientList").children().length) {
                        $("#patientList").append("<tr><td colspan='6' align='center'>No Patients Found</td></tr>");
                    }
                }
            };
        });

        $(document).on("click", ".deletePatient", function() {
            let id = Number($(this).data("id"));
            let transaction = db.transaction(["patients"], "readwrite");
            let objectStore = transaction.objectStore("patients");
            let request = objectStore.delete(id);

            request.onsuccess = function() {
                $("#row" + id).fadeOut();
                alert("Patient deleted successfully.");
            };
        });

        $(document).on("click", ".updatePatient", function() {
            let id = Number($(this).data("id"));

            let transaction = db.transaction(["patients"], "readwrite");
            let objectStore = transaction.objectStore("patients");
            let request = objectStore.get(id);

            request.onsuccess = function(event) {
                let data = event.target.result;
                if (!data) {
                    alert("Patient not found.");
                    return;
                }

                let newName = prompt("Enter new Patient Name:", data.patient_name) || data.patient_name;
                let newAge = prompt("Enter new Age:", data.age) || data.age;
                let newGender = prompt("Enter new Gender (Male/Female/Other):", data.gender) || data.gender;
                let newPhone = prompt("Enter new Phone No.:", data.phone) || data.phone;

                data.patient_name = newName;
                data.age = newAge;
                data.gender = newGender;
                data.phone = newPhone;

                let updateRequest = objectStore.put(data);

                updateRequest.onsuccess = function() {
                    $("#name" + id).text(newName);
                    $("#age" + id).text(newAge);
                    $("#gender" + id).text(newGender);
                    $("#phone" + id).text(newPhone);

                    alert("Patient record updated successfully.");
                };

                updateRequest.onerror = function() {
                    alert("Error updating patient record.");
                };
            };
        });

        function clearFields() {
            $("#patient_id").val("");
            $("#patient_name").val("");
            $("#age").val("");
            $("#gender").val("");
            $("#phone").val("");
        }
    </script>
</body>
</html>
